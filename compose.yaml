# Default includes the CPU parser and retrieval service. GPU serving is explicit.
name: "nic-msi-expert"
services:
  postgres:
    image: "pgvector/pgvector:0.8.2-pg17@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966"
    restart: "unless-stopped"
    environment:
      POSTGRES_USER: "expert_admin"
      POSTGRES_DB: "expert"
      POSTGRES_PASSWORD_FILE: "/run/secrets/admin_db_password"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    secrets: ["admin_db_password"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: ["app_internal"]
    command: ["postgres","-c","shared_buffers=512MB","-c","work_mem=16MB","-c","max_connections=100"]
    mem_limit: "2g"
    cpus: 2
    shm_size: "512m"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U expert_admin -d expert"]
      interval: "5s"
      timeout: "3s"
      retries: 20
  redis:
    image: "redis:8.8.2-alpine@sha256:96cb544fa0af5aa898d160cffb7dae70c3df117190fc123831c64712cda425ff"
    restart: "unless-stopped"
    command: ["redis-server","/etc/redis/redis.conf"]
    configs: [{"source":"redis_config","target":"/etc/redis/redis.conf"}]
    secrets: ["redis_users.acl","health_redis_password"]
    volumes: ["redis_data:/data"]
    networks: ["app_internal"]
    mem_limit: "768m"
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL","REDISCLI_AUTH=$$(cat /run/secrets/health_redis_password) redis-cli --no-auth-warning --user expert_health ping | grep -q PONG"]
      interval: "5s"
      timeout: "3s"
      retries: 20
  object-storage:
    image: "minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e"
    restart: "unless-stopped"
    command: ["server","/data","--console-address",":9001"]
    environment:
      MINIO_ROOT_USER_FILE: "/run/secrets/minio_root_user"
      MINIO_ROOT_PASSWORD_FILE: "/run/secrets/minio_root_password"
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:${EXPERT_S3_CONSOLE_PORT:-59001}"
      MINIO_UPDATE: "off"
    secrets: ["minio_root_user","minio_root_password"]
    volumes: ["object_storage_data:/data"]
    networks: ["app_internal"]
    mem_limit: "1g"
    cpus: 1
    healthcheck:
      test: ["CMD","curl","-fsS","http://127.0.0.1:9000/minio/health/ready"]
      interval: "5s"
      timeout: "3s"
      retries: 30
  db-bootstrap:
    image: "nic-msi-expert/backend:p01"
    build:
      context: "."
      dockerfile: "infra/docker/Dockerfile.service"
      target: "service"
      args:
        EXPERT_PACKAGE: "expert-backend"
    command: ["python","scripts/bootstrap.py","database-init"]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: ["app_internal"]
    mem_limit: "256m"
    depends_on:
      postgres:
        condition: "service_healthy"
    secrets: ["admin_database_dsn","backend_db_password","runtime_db_password","ingest_db_password","outbox_db_password","migrate_db_password"]
    healthcheck:
      disable: true
  db-migrate:
    image: "nic-msi-expert/db-migrate:p02"
    build:
      context: "."
      dockerfile: "infra/docker/Dockerfile.service"
      target: "migration"
      args:
        EXPERT_PACKAGE: "expert-backend"
    command: ["python","scripts/migrate.py","--dsn-file","/run/secrets/migrate_database_dsn"]
    init: true
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: ["app_internal"]
    mem_limit: "512m"
    cpus: 1
    depends_on:
      db-bootstrap:
        condition: "service_completed_successfully"
    secrets: ["migrate_database_dsn"]
    healthcheck:
      disable: true
  storage-init:
    image: "minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727"
    entrypoint: ["/bin/sh","/bootstrap/storage-init.sh"]
    restart: "no"
    environment:
      MC_CONFIG_DIR: "/tmp/mc"
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    configs: [{"source":"storage_init","target":"/bootstrap/storage-init.sh"},{"source":"backend_s3_policy","target":"/policies/backend.json"},{"source":"ingest_s3_policy","target":"/policies/ingest.json"}]
    secrets: ["minio_root_user","minio_root_password","backend_s3_access_key","backend_s3_secret_key","ingest_s3_access_key","ingest_s3_secret_key"]
    networks: ["app_internal"]
    mem_limit: "256m"
    depends_on:
      object-storage:
        condition: "service_healthy"
  backend:
    init: true
    restart: "unless-stopped"
    read_only: true
    # Two upload spools, one source viewer and one verified parser artifact.
    tmpfs: ["/tmp:size=384m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: ["app_internal","observability_internal"]
    mem_limit: "768m"
    cpus: 1
    stop_grace_period: "30s"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: "10s"
      timeout: "4s"
      start_period: "15s"
      retries: 6
    image: "nic-msi-expert/backend:p01"
    build:
      context: "."
      dockerfile: "infra/docker/Dockerfile.service"
      target: "service"
      args:
        EXPERT_PACKAGE: "expert-backend"
    command: ["uvicorn","expert_api.main:app","--host","0.0.0.0","--port","8000","--no-access-log"]
    environment:
      EXPERT_APP_ENV: "local"
      EXPERT_LOG_LEVEL: "${EXPERT_LOG_LEVEL:-INFO}"
      EXPERT_PORT: "8000"
      EXPERT_PUBLIC_BASE_URL: "${EXPERT_PUBLIC_BASE_URL:-http://localhost:8080}"
      EXPERT_INTERNAL_API_VERSION: "v1"
      EXPERT_OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      EXPERT_JAEGER_PUBLIC_BASE_URL: "http://localhost:${EXPERT_JAEGER_PORT:-16687}"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      EXPERT_SERVICE_NAME: "backend"
      EXPERT_OTEL_SERVICE_NAME: "backend"
      EXPERT_DATABASE_DSN_FILE: "/run/secrets/backend_database_dsn"
      EXPERT_REDIS_URL_FILE: "/run/secrets/backend_redis_url"
      EXPERT_AGENT_RUNTIME_TOKEN_FILE: "/run/secrets/agent_runtime_token"
      EXPERT_VIEWER_ACCESS_KEY_FILE: "/run/secrets/viewer_access_key"
      EXPERT_OPERATOR_ACCESS_KEY_FILE: "/run/secrets/operator_access_key"
      EXPERT_ADMIN_ACCESS_KEY_FILE: "/run/secrets/admin_access_key"
      EXPERT_S3_ENDPOINT: "http://object-storage:9000"
      EXPERT_S3_ACCESS_KEY_FILE: "/run/secrets/backend_s3_access_key"
      EXPERT_S3_SECRET_KEY_FILE: "/run/secrets/backend_s3_secret_key"
    secrets: ["backend_database_dsn","backend_redis_url","agent_runtime_token","backend_s3_access_key","backend_s3_secret_key","viewer_access_key","operator_access_key","admin_access_key"]
    depends_on:
      db-migrate:
        condition: "service_completed_successfully"
      redis:
        condition: "service_healthy"
      storage-init:
        condition: "service_completed_successfully"
  agent-runtime:
    init: true
    restart: "unless-stopped"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: ["app_internal","model_internal","observability_internal"]
    mem_limit: "768m"
    cpus: 1
    stop_grace_period: "30s"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: "10s"
      timeout: "4s"
      start_period: "15s"
      retries: 6
    image: "nic-msi-expert/agent-runtime:p01"
    build:
      context: "."
      dockerfile: "infra/docker/Dockerfile.service"
      target: "service"
      args:
        EXPERT_PACKAGE: "expert-agent-runtime"
    command: ["uvicorn","expert_agent.main:app","--host","0.0.0.0","--port","8000","--no-access-log"]
    environment:
      EXPERT_APP_ENV: "local"
      EXPERT_LOG_LEVEL: "${EXPERT_LOG_LEVEL:-INFO}"
      EXPERT_PORT: "8000"
      EXPERT_PUBLIC_BASE_URL: "${EXPERT_PUBLIC_BASE_URL:-http://localhost:8080}"
      EXPERT_INTERNAL_API_VERSION: "v1"
      EXPERT_OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      EXPERT_JAEGER_PUBLIC_BASE_URL: "http://localhost:${EXPERT_JAEGER_PORT:-16687}"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      EXPERT_SERVICE_NAME: "agent-runtime"
      EXPERT_OTEL_SERVICE_NAME: "agent-runtime"
      EXPERT_DATABASE_DSN_FILE: "/run/secrets/runtime_database_dsn"
      EXPERT_REDIS_URL_FILE: "/run/secrets/runtime_redis_url"
      EXPERT_AGENT_RUNTIME_TOKEN_FILE: "/run/secrets/agent_runtime_token"
      EXPERT_RETRIEVAL_ML_TOKEN_FILE: "/run/secrets/retrieval_ml_token"
      EXPERT_LLM_API_KEY_FILE: "/run/secrets/llm_api_key"
      EXPERT_LLM_BASE_URL: "http://vllm:8000/v1"
      EXPERT_LLM_REVISION: "31c69efc29464b6bb0aee1398b5a7b50a99340c3"
    secrets: ["runtime_database_dsn","runtime_redis_url","agent_runtime_token","retrieval_ml_token","llm_api_key"]
    depends_on:
      db-migrate:
        condition: "service_completed_successfully"
      redis:
        condition: "service_healthy"
  ingestion-worker:
    init: true
    # Keep parser RLIMIT_NPROC independent of other services on the Linux host.
    user: "10003:10003"
    restart: "unless-stopped"
    read_only: true
    tmpfs: ["/tmp:size=768m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: ["app_internal","model_internal","observability_internal"]
    mem_limit: "6g"
    memswap_limit: "6g"
    pids_limit: 96
    cpus: 2
    stop_grace_period: "30s"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: "10s"
      timeout: "4s"
      start_period: "15s"
      retries: 6
    image: "nic-msi-expert/ingestion-worker:p04-parser"
    build:
      context: "."
      dockerfile: "infra/docker/Dockerfile.service"
      target: "parser"
      args:
        EXPERT_PACKAGE: "expert-ingestion-worker"
    command: ["uvicorn","expert_ingest.main:app","--host","0.0.0.0","--port","8000","--workers","1","--no-access-log"]
    environment:
      EXPERT_APP_ENV: "local"
      EXPERT_LOG_LEVEL: "${EXPERT_LOG_LEVEL:-INFO}"
      EXPERT_PORT: "8000"
      EXPERT_PUBLIC_BASE_URL: "${EXPERT_PUBLIC_BASE_URL:-http://localhost:8080}"
      EXPERT_INTERNAL_API_VERSION: "v1"
      EXPERT_OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      EXPERT_JAEGER_PUBLIC_BASE_URL: "http://localhost:${EXPERT_JAEGER_PORT:-16687}"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      EXPERT_SERVICE_NAME: "ingestion-worker"
      EXPERT_INGESTION_JOB_TIMEOUT_SECONDS: "3600"
      EXPERT_INGESTION_PARSER_PYTHON_PATH: "/app/.venv-parser/bin/python"
      EXPERT_INGESTION_PARSER_PROFILE_PATH: "/app/infra/compose/parser-profile.json"
      EXPERT_INGESTION_PARSER_ASSETS_LOCK_PATH: "/app/parser-assets.lock.json"
      EXPERT_INGESTION_REGION_REVIEWS_PATH: "/app/config/parsing/region-reviews.json"
      EXPERT_DOCLING_ARTIFACTS_PATH: "/models/docling"
      EXPERT_EMBEDDING_MODEL_PATH: "/models/frida"
      EXPERT_EMBEDDING_REVISION: "850455b605544a944739b25f81ddf812b6e3d0d5"
      EXPERT_MODELS_LOCK_PATH: "/app/models.lock.json"
      EXPERT_RETRIEVAL_ML_URL: "http://retrieval-ml:8000"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      EXPERT_OTEL_SERVICE_NAME: "ingestion-worker"
      EXPERT_DATABASE_DSN_FILE: "/run/secrets/ingest_database_dsn"
      EXPERT_REDIS_URL_FILE: "/run/secrets/ingest_redis_url"
      EXPERT_RETRIEVAL_ML_TOKEN_FILE: "/run/secrets/retrieval_ml_token"
      EXPERT_S3_ENDPOINT: "http://object-storage:9000"
      EXPERT_S3_ACCESS_KEY_FILE: "/run/secrets/ingest_s3_access_key"
      EXPERT_S3_SECRET_KEY_FILE: "/run/secrets/ingest_s3_secret_key"
    secrets: ["ingest_database_dsn","ingest_redis_url","retrieval_ml_token","ingest_s3_access_key","ingest_s3_secret_key"]
    volumes: ["./models/docling:/models/docling:ro","./models/frida:/models/frida:ro"]
    depends_on:
      retrieval-ml:
        condition: "service_healthy"
      db-migrate:
        condition: "service_completed_successfully"
      redis:
        condition: "service_healthy"
      storage-init:
        condition: "service_completed_successfully"
  outbox-publisher:
    init: true
    restart: "unless-stopped"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: ["app_internal","observability_internal"]
    mem_limit: "256m"
    cpus: 1
    stop_grace_period: "30s"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: "10s"
      timeout: "4s"
      start_period: "15s"
      retries: 6
    image: "nic-msi-expert/outbox-publisher:p01"
    build:
      context: "."
      dockerfile: "infra/docker/Dockerfile.service"
      target: "service"
      args:
        EXPERT_PACKAGE: "expert-outbox-publisher"
    command: ["uvicorn","expert_outbox.main:app","--host","0.0.0.0","--port","8000","--no-access-log"]
    environment:
      EXPERT_APP_ENV: "local"
      EXPERT_LOG_LEVEL: "${EXPERT_LOG_LEVEL:-INFO}"
      EXPERT_PORT: "8000"
      EXPERT_PUBLIC_BASE_URL: "${EXPERT_PUBLIC_BASE_URL:-http://localhost:8080}"
      EXPERT_INTERNAL_API_VERSION: "v1"
      EXPERT_OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      EXPERT_JAEGER_PUBLIC_BASE_URL: "http://localhost:${EXPERT_JAEGER_PORT:-16687}"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      EXPERT_SERVICE_NAME: "outbox-publisher"
      EXPERT_OTEL_SERVICE_NAME: "outbox-publisher"
      EXPERT_DATABASE_DSN_FILE: "/run/secrets/outbox_database_dsn"
      EXPERT_REDIS_URL_FILE: "/run/secrets/outbox_redis_url"
    secrets: ["outbox_database_dsn","outbox_redis_url"]
    depends_on:
      db-migrate:
        condition: "service_completed_successfully"
      redis:
        condition: "service_healthy"
  frontend:
    image: "nic-msi-expert/frontend:p01"
    build:
      context: "."
      dockerfile: "apps/frontend/Dockerfile"
    restart: "unless-stopped"
    ports: ["127.0.0.1:${EXPERT_FRONTEND_PORT:-8080}:8080"]
    networks: ["edge","app_internal"]
    read_only: true
    tmpfs: ["/tmp:size=32m","/var/cache/nginx:size=16m","/var/run:size=1m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: "128m"
    cpus: 0.5
    depends_on:
      backend:
        condition: "service_healthy"
    healthcheck:
      test: ["CMD","wget","-q","-O","/dev/null","http://127.0.0.1:8080/health/ready"]
      interval: "10s"
      timeout: "3s"
      retries: 6
  otel-collector:
    image: "nic-msi-expert/otel-collector:0.160.0"
    build:
      context: "."
      dockerfile: "infra/docker/Dockerfile.probed"
      args:
        BASE_IMAGE: "otel/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6"
    restart: "unless-stopped"
    command: ["--config=/etc/otel/config.yaml"]
    configs: [{"source":"otel_config","target":"/etc/otel/config.yaml"}]
    networks: ["observability_internal"]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    mem_limit: "256m"
    cpus: 0.5
    healthcheck:
      test: ["CMD","/busybox","wget","-q","-O","/dev/null","http://127.0.0.1:13133/"]
      interval: "10s"
      timeout: "3s"
      retries: 6
  jaeger:
    image: "nic-msi-expert/jaeger:2.20.0"
    build:
      context: "."
      dockerfile: "infra/docker/Dockerfile.probed"
      args:
        BASE_IMAGE: "jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8"
    restart: "unless-stopped"
    command: ["--config=/etc/jaeger/config.yaml"]
    configs: [{"source":"jaeger_config","target":"/etc/jaeger/config.yaml"}]
    networks: ["observability_internal"]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    mem_limit: "256m"
    cpus: 0.5
    healthcheck:
      test: ["CMD","/busybox","wget","-q","-O","/dev/null","http://127.0.0.1:13133/status"]
      interval: "10s"
      timeout: "3s"
      retries: 6
  retrieval-ml:
    init: true
    restart: "unless-stopped"
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: ["model_internal","observability_internal"]
    mem_limit: "8g"
    memswap_limit: "8g"
    pids_limit: 256
    cpus: 8
    stop_grace_period: "30s"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: "15s"
      timeout: "4s"
      start_period: "120s"
      retries: 10
    image: "nic-msi-expert/retrieval-ml:p01"
    build:
      context: "."
      dockerfile: "infra/docker/Dockerfile.service"
      target: "retrieval-ml"
      args:
        EXPERT_PACKAGE: "expert-retrieval-ml"
    command: ["uvicorn","expert_ml.main:app","--host","0.0.0.0","--port","8000","--workers","1","--no-access-log"]
    environment:
      EXPERT_APP_ENV: "local"
      EXPERT_LOG_LEVEL: "${EXPERT_LOG_LEVEL:-INFO}"
      EXPERT_PORT: "8000"
      EXPERT_PUBLIC_BASE_URL: "${EXPERT_PUBLIC_BASE_URL:-http://localhost:8080}"
      EXPERT_INTERNAL_API_VERSION: "v1"
      EXPERT_OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      EXPERT_JAEGER_PUBLIC_BASE_URL: "http://localhost:${EXPERT_JAEGER_PORT:-16687}"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      EXPERT_SERVICE_NAME: "retrieval-ml"
      EXPERT_ML_CPU_THREADS: "8"
      EXPERT_MODELS_LOCK_PATH: "/app/models.lock.json"
      EXPERT_OTEL_SERVICE_NAME: "retrieval-ml"
      EXPERT_RETRIEVAL_ML_TOKEN_FILE: "/run/secrets/retrieval_ml_token"
      EXPERT_EMBEDDING_MODEL_PATH: "/models/frida"
      EXPERT_EMBEDDING_REVISION: "850455b605544a944739b25f81ddf812b6e3d0d5"
      EXPERT_RERANKER_MODEL_PATH: "/models/qwen3-reranker-0.6b"
      EXPERT_RERANKER_REVISION: "e61197ed45024b0ed8a2d74b80b4d909f1255473"
      EXPERT_RERANKER_DEVICE: "${EXPERT_RERANKER_DEVICE:-cpu}"
      EXPERT_RERANKER_CUDA_MAX_BATCH_TOKENS: "${EXPERT_RERANKER_CUDA_MAX_BATCH_TOKENS:-2048}"
    secrets: ["retrieval_ml_token"]
    volumes: ["./models/frida:/models/frida:ro","./models/qwen3-reranker-0.6b:/models/qwen3-reranker-0.6b:ro"]
  vllm:
    profiles: ["models"]
    image: "vllm/vllm-openai:v0.12.0@sha256:f2309d913a07da49ea20b2a694703f4cfcb5ad8e7437ec0f26145479ac01e002"
    restart: "unless-stopped"
    entrypoint: ["/bin/bash","-c"]
    command: ["export VLLM_API_KEY=\"$$(cat /run/secrets/llm_api_key)\"; exec vllm serve /models/qwen3-14b-awq --served-model-name Qwen/Qwen3-14B-AWQ --host 0.0.0.0 --port 8000 --max-model-len 8192 --max-num-seqs 1 --max-num-batched-tokens 512 --gpu-memory-utilization 0.85 --enforce-eager --disable-log-requests --generation-config vllm --structured-outputs-config '{\"backend\":\"xgrammar\",\"disable_fallback\":true}'"]
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      VLLM_NO_USAGE_STATS: "1"
      VLLM_CACHE_ROOT: "/cache/vllm"
      VLLM_HOST_IP: "127.0.0.1"
      TZ: "UTC"
    secrets: ["llm_api_key"]
    volumes: ["./models:/models:ro","vllm_cache:/cache"]
    networks: ["model_internal"]
    shm_size: "1g"
    mem_limit: "18g"
    cpus: 8
    deploy:
      resources:
        reservations:
          devices: [{"driver":"nvidia","count":1,"capabilities":["gpu"]}]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: "15s"
