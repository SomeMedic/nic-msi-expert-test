[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "expert-ingestion-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "expert-contracts",
  "expert-service-clients",
  "expert-observability",
  "uvicorn==0.52.4",
  "PyMuPDF==1.28.2",
  "transformers==4.57.3",
  "tokenizers==0.22.2",
  "huggingface-hub==0.36.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/expert_ingest"]
