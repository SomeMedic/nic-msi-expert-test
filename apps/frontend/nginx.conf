server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    # Allow a 50 MiB file plus multipart overhead; the API enforces exact file bytes.
    client_max_body_size 52m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_upstream http://backend:8000;

    location = /health/live {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health/ready {
        default_type text/plain;
        if (!-f $document_root/index.html) {
            return 503 "not ready\n";
        }
        return 200 "ready\n";
    }

    location ^~ /api/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Stream uploads to the API; the 32 MiB proxy tmpfs cannot spool a 50 MiB file.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
    }

    location = /api {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
