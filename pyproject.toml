[project]
name = "nic-msi-expert"
version = "0.1.0"
description = "Digital Expert service workspace"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "ruff==0.16.6",
  "mypy==2.3.1",
  "pypdf==6.18.0",
]

[tool.uv]
package = false
required-version = "==0.10.3"
build-constraint-dependencies = ["hatchling==1.32.0"]

[tool.uv.workspace]
members = [
  "apps/backend", "apps/agent-runtime", "apps/ingestion-worker",
  "apps/retrieval-ml", "apps/outbox-publisher",
  "packages/contracts", "packages/service-clients", "packages/observability",
]

[tool.uv.sources]
expert-contracts = { workspace = true }
expert-service-clients = { workspace = true }
expert-observability = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["scripts/spikes", "docs/implementation/evidence"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
